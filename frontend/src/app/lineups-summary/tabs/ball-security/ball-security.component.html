@if (store.selected(); as lineup) {
  <div class="tab-stack">
    <lineup-header [lineup]="lineup" />

    <div class="tiles">
      @for (tile of tiles(); track tile.label) {
        <div class="tile">
          <div class="tile-label">{{ tile.label }}</div>
          <div class="tile-value">{{ tile.value }}</div>
          <div class="tile-detail">{{ tile.detail }}</div>
        </div>
      }
    </div>

    <div class="tab-grid">
      <section class="card">
        <div class="card-head">
          <h2>Turnovers committed vs. forced</h2>
          <span class="muted">Click a bubble to inspect it</span>
        </div>
        <scatter-chart
          [lineups]="store.visible()"
          [selectedKey]="store.selectedId()"
          xKey="offensive_turnover_rate"
          yKey="defensive_turnover_rate"
          xLabel="Turnover rate (lower is better)"
          yLabel="Turnovers forced"
          [percent]="true"
          [quadrants]="quadrants"
          (selectLineup)="store.select($event)"
        />
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Lineup vs. opponents</h2>
        </div>
        <split-bars
          [rows]="rows()"
          [leftLabel]="lineup.team_name + ' lineup'"
          note="The brighter side of each bar won that battle. Turnover rate is won by the lower number."
        />
      </section>
    </div>
  </div>
}
